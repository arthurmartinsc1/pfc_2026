# Nome do projeto fixo: sem isso o Compose usaria o nome da pasta, e mover
# esta aplicacao para `web/` apontaria para um volume novo e vazio em vez do
# banco existente (`pfc_web_db_data`).
name: pfc_web

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: noticias
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
