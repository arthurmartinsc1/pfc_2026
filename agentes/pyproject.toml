[project]
name = "agentes-noticias"
version = "0.1.0"
description = "Camada de agentes de IA (buscador + resumidor) do sistema de noticias"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "trafilatura>=1.8",
    "gnews>=0.3.6",
    "googlenewsdecoder>=0.1.7",
    "playwright>=1.45",
    "transformers>=4.46",
    "accelerate>=1.0",
    "torch>=2.4",
    "sentencepiece>=0.2",
    "huggingface_hub>=0.25",
]
